# Раздача SPA + прокси /api на Express. SSE (/api/events) требует отключённой
# буферизации и долгого read-таймаута — вынесен в отдельный exact-match location.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Сжатие ответов. text/html сжимается nginx'ом всегда при gzip on; остальные
  # типы перечисляем явно. gzip_static оставлен off: vite-сборка не кладёт .gz
  # рядом с ассетами — включать нечего (включить, если появится этап препрессинга).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Хэшированные ассеты vite — содержимое никогда не меняется, кэш на год, immutable.
  location /assets/ {
    add_header Cache-Control 'public, max-age=31536000, immutable';
    try_files $uri =404;
  }

  # Обычные API-запросы (JSON).
  location /api/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SSE-поток патчей: без буферизации (иначе патчи копятся в буфере nginx и не
  # доходят до клиента), долгие таймауты, HTTP/1.1 с пустым Connection —
  # keep-alive без upgrade-семантики.
  location = /api/events {
    proxy_pass http://server:4000/api/events;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # Заголовок X-Accel-Buffering: no, который шлёт Express, пробрасывается
    # клиенту как есть — дополнительно отключает буферизацию на промежуточных
    # прокси (proxy_ignore_headers X-Accel-Buffering здесь НЕ ставим).
  }

  # SPA-фолбэк: неизвестные пути отдают index.html (роутинг на клиенте).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
